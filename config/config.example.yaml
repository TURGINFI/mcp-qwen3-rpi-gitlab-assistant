# Reference configuration only.
# The current runtime reads secrets and endpoints from environment variables.

runtime:
  mode_env: "ASSISTANT_MODE"        # demo or local

gitlab:
  base_url_env: "GITLAB_BASE_URL"   # defaults to https://gitlab.com
  token_env: "GITLAB_TOKEN"         # required only for ASSISTANT_MODE=local

model:
  api_url_env: "QWEN_API_URL"       # defaults to http://127.0.0.1:9000/v1/chat/completions
  model_name_env: "QWEN_MODEL_NAME" # defaults to qwen3-0.6b
